<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1220">
<title>扭蛋抽题</title>
<style>
  :root{
    --bg1:#131a2e; --bg2:#0b0e1a;
    --panel:#1e2636; --line:#2c3648;
    --fg:#eef2f8; --dim:#93a0b5;
    --metal1:#f2f5fb; --metal2:#9aa8bf; --metal3:#5b6880;
    --machine1:#e8484f; --machine2:#b3272e; --machine3:#7d161b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:radial-gradient(120% 80% at 50% 0%, var(--bg1) 0%, var(--bg2) 70%);
    color:var(--fg); min-height:100vh;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:14px 16px calc(26px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  h1{font-size:19px;font-weight:700;margin:4px 0 12px;letter-spacing:1px;
     background:linear-gradient(180deg,#fff,#9fb4d8);-webkit-background-clip:text;
     background-clip:text;color:transparent}

  /* ── 抽题范围 ── */
  .chips{display:flex;gap:6px;width:100%;max-width:360px;overflow-x:auto;
         padding:2px 2px 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--dim);font-size:12.5px;padding:6px 12px;border-radius:999px;
    white-space:nowrap;cursor:pointer;transition:all .18s;
    font-family:inherit;
  }
  .chip.on{background:rgba(79,140,255,.18);border-color:rgba(79,140,255,.55);
           color:#cfe0ff;font-weight:600}

  /* ── 扭蛋机 ── */
  .machine{position:relative;width:260px;margin:2px auto 0;user-select:none}

  .dome{
    position:relative;width:196px;height:196px;margin:0 auto -26px;border-radius:50%;
    background:
      radial-gradient(circle at 34% 26%, rgba(255,255,255,.42), rgba(255,255,255,.06) 42%, transparent 62%),
      radial-gradient(circle at 50% 50%, rgba(120,190,255,.16), rgba(40,60,110,.30));
    border:3px solid rgba(210,232,255,.55);
    box-shadow:inset 0 -14px 32px rgba(0,0,0,.45),
               inset 0 10px 26px rgba(255,255,255,.18),
               0 10px 30px rgba(0,0,0,.5);
    overflow:hidden;
  }
  .balls{position:absolute;inset:0}
  .balls span{position:absolute;border-radius:50%;
              box-shadow:inset -3px -4px 7px rgba(0,0,0,.35),
                         inset 3px 3px 6px rgba(255,255,255,.45)}
  .dome.jiggle .balls{animation:jig .5s linear 2}
  @keyframes jig{
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(-2.5px,1.5px) rotate(-1.2deg)}
    75%{transform:translate(2.5px,-1.5px) rotate(1.2deg)}
  }

  .body{
    position:relative;width:260px;height:150px;border-radius:20px 20px 24px 24px;
    background:linear-gradient(180deg,var(--machine1),var(--machine2) 55%,var(--machine3));
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35),
               inset 0 -10px 22px rgba(0,0,0,.45),
               0 14px 30px rgba(0,0,0,.5);
  }
  .body::after{
    content:'';position:absolute;left:12px;right:12px;top:8px;height:5px;border-radius:4px;
    background:rgba(255,255,255,.28);
  }

  /* 旋钮 */
  .knob{
    position:absolute;left:50%;top:16px;margin-left:-34px;
    width:68px;height:68px;border:0;padding:0;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 36% 30%, var(--metal1), var(--metal2) 52%, var(--metal3));
    box-shadow:0 6px 14px rgba(0,0,0,.5), inset 0 -3px 8px rgba(0,0,0,.35),
               inset 0 3px 6px rgba(255,255,255,.6);
    transition:transform .65s cubic-bezier(.35,1.5,.5,1);
    display:flex;align-items:center;justify-content:center;
  }
  .knob:active{filter:brightness(1.08)}
  .knob::before{
    content:'';width:9px;height:34px;border-radius:5px;
    background:linear-gradient(180deg,#4a5468,#2b3242);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.7);
  }
  .knob:disabled{cursor:default;filter:saturate(.6) brightness(.9)}

  /* 出蛋口 */
  .chute{
    position:absolute;left:50%;bottom:12px;margin-left:-52px;
    width:104px;height:44px;border-radius:10px;
    background:linear-gradient(180deg,#120d12,#241a20);
    box-shadow:inset 0 8px 16px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.22);
  }
  .chute::after{
    content:'';position:absolute;left:8px;right:8px;bottom:7px;height:4px;border-radius:3px;
    background:rgba(255,255,255,.13);
  }

  /* ── 掉落区 ── */
  .dropzone{position:relative;width:100%;max-width:360px;height:118px;margin-top:2px}
  .tray{
    position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    width:150px;height:12px;border-radius:50%;
    background:radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.22), rgba(255,255,255,.03) 70%);
    box-shadow:0 6px 18px rgba(0,0,0,.45);
  }

  .capsule{
    position:absolute;left:50%;top:0;width:58px;height:58px;
    transform:translate(-50%,-52px);opacity:0;pointer-events:none;
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));
  }
  .capsule.show{opacity:1}
  .cap-half{position:absolute;left:0;width:58px;height:29px;
            transition:transform .5s ease-out, opacity .5s}
  .capsule.noanim .cap-half{transition:none}
  .cap-top{top:0;border-radius:29px 29px 4px 4px;
           background:linear-gradient(180deg,rgba(255,255,255,.55),transparent),var(--c1)}
  .cap-bot{bottom:0;border-radius:4px 4px 29px 29px;
           background:linear-gradient(0deg,rgba(0,0,0,.25),transparent),var(--c2)}
  .capsule::after{
    content:'';position:absolute;left:4px;right:4px;top:26px;height:6px;
    background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(255,255,255,.25));
    border-radius:3px;
  }
  .capsule.shake{animation:cshake .09s linear infinite}
  @keyframes cshake{
    0%{transform:translate(-50%,74px) rotate(-3deg)}
    50%{transform:translate(-50%,72px) rotate(3deg)}
    100%{transform:translate(-50%,74px) rotate(-3deg)}
  }
  .capsule.burst .cap-top{transform:translate(-44px,-52px) rotate(-42deg);opacity:0}
  .capsule.burst .cap-bot{transform:translate(44px,52px) rotate(42deg);opacity:0}
  .capsule.burst::after{opacity:0;transition:opacity .2s}

  /* 闪光 */
  .flash{
    position:absolute;left:50%;top:74px;width:20px;height:20px;margin:-10px 0 0 -10px;
    border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 65%);
    opacity:0;pointer-events:none;
  }
  .flash.go{animation:flash .62s ease-out}
  @keyframes flash{
    0%{opacity:0;transform:scale(.3)}
    22%{opacity:1;transform:scale(3.4)}
    100%{opacity:0;transform:scale(9)}
  }

  /* 彩带 */
  .confetti{position:absolute;left:50%;top:74px;width:0;height:0;pointer-events:none}
  .confetti i{
    position:absolute;left:0;top:0;width:8px;height:12px;border-radius:2px;
    animation:fly .95s cubic-bezier(.2,.7,.4,1) forwards;
  }
  @keyframes fly{
    0%{transform:translate(-50%,-50%) rotate(0) scale(.4);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1);opacity:0}
  }

  /* ── 提示 & 题目卡 ── */
  .hint{color:var(--dim);font-size:13px;text-align:center;min-height:20px;margin-top:4px}

  .card{
    width:100%;max-width:360px;margin-top:14px;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:16px;display:none;
  }
  .card.show{display:block;animation:pop .42s cubic-bezier(.2,1.4,.5,1)}
  @keyframes pop{
    0%{opacity:0;transform:translateY(26px) scale(.9)}
    100%{opacity:1;transform:none}
  }
  .tag{
    display:inline-block;font-size:12px;color:#bcd0ff;
    background:rgba(79,140,255,.16);border:1px solid rgba(79,140,255,.35);
    border-radius:999px;padding:2px 10px;margin-bottom:12px;
  }
  .q{font-size:17px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .opts{list-style:none;padding:0;margin:12px 0 0}
  .opts li{
    padding:9px 12px;margin-top:8px;font-size:15px;line-height:1.6;
    border:1px solid var(--line);border-radius:10px;
    background:rgba(255,255,255,.03);word-break:break-word;
  }
  .opts li b{color:#8fb4ff;margin-right:6px;font-weight:700}
  .src{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);
       font-size:12px;color:var(--dim);letter-spacing:.3px}

  /* 音效开关 */
  .mute{
    position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:9;
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    background:rgba(30,38,54,.85);color:var(--dim);font-size:16px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .mute.off{color:#ff8b8b}
</style>
</head>
<body>

<div class="mute" id="mute" title="音效开关">🔊</div>

<h1>扭蛋抽题</h1>

<div class="chips" id="chips"></div>

<div class="machine">
  <div class="dome" id="dome"><div class="balls" id="balls"></div></div>
  <div class="body">
    <button class="knob" id="knob" aria-label="转动旋钮抽题"></button>
    <div class="chute"></div>
  </div>
</div>

  <div class="tray"></div>
  <div class="flash" id="flash"></div>
  <div class="confetti" id="confetti"></div>
  <div class="capsule" id="capsule">
    <span class="cap-half cap-top"></span>
    <span class="cap-half cap-bot"></span>
  </div>
</div>

<div class="hint" id="hint">转动旋钮，抽一颗扭蛋</div>
<div class="card" id="card"></div>

  /* ===================== 音效（Web Audio 合成，不依赖任何音频文件）===== */
  var Sound = (function () {
    var ctx = null, muted = false;
    function ac() {
      if (!ctx) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        try { ctx = new C(); } catch (e) { return null; }
      }
      if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
      return ctx;
    }
    function tone(o) {
      if (muted) return;
      var c = ac(); if (!c) return;
      var t0 = c.currentTime + (o.delay || 0);
      var dur = o.dur || 0.15;
      var osc = c.createOscillator(), g = c.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.freq, t0);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(o.gain || 0.18, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(c.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.04);
    }
    function noise(o) {
      if (muted) return;
      var c = ac(); if (!c) return;
      var t0 = c.currentTime + (o.delay || 0);
      var dur = o.dur || 0.25;
      var len = Math.max(1, Math.floor(c.sampleRate * dur));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, o.decay || 2.5);
      var src = c.createBufferSource(); src.buffer = buf;
      var f = c.createBiquadFilter();
      f.type = o.filter || 'bandpass';
      f.frequency.value = o.freq || 1200;
      f.Q.value = 0.8;
      var g = c.createGain(); g.gain.value = o.gain || 0.28;
      src.connect(f); f.connect(g); g.connect(c.destination);
      src.start(t0);
    }
    return {
      unlock: function () { ac(); },
      turn: function () {
        for (var i = 0; i < 5; i++) {
          tone({ freq: 1000 + i * 55, dur: 0.045, type: 'square', gain: 0.07, delay: i * 0.115 });
          noise({ dur: 0.03, freq: 2600, gain: 0.10, delay: i * 0.115, decay: 5 });
        }
      },
      drop: function () { tone({ freq: 340, to: 110, dur: 0.30, type: 'sine', gain: 0.20 }); },
      bounce: function (p) {
        tone({ freq: 170 + p * 300, to: 90, dur: 0.085, type: 'triangle', gain: 0.13 });
        noise({ dur: 0.05, freq: 900, gain: 0.07, decay: 4 });
      },
      rumble: function () {
        for (var i = 0; i < 9; i++) {
          noise({ dur: 0.05, freq: 2200 + Math.random() * 1400, gain: 0.10, delay: i * 0.075, decay: 5 });
        }
        tone({ freq: 120, to: 210, dur: 0.7, type: 'sawtooth', gain: 0.05 });
      },
      pop: function () {
        noise({ dur: 0.35, freq: 800, gain: 0.55, filter: 'lowpass', decay: 3.2 });
        tone({ freq: 620, to: 1900, dur: 0.20, type: 'square', gain: 0.13 });
      },
      fanfare: function () {
        [523.25, 659.25, 783.99, 1046.50].forEach(function (f, i) {
          tone({ freq: f, dur: 0.38, type: 'triangle', gain: 0.17, delay: i * 0.10 });
          tone({ freq: f * 2, dur: 0.30, type: 'sine', gain: 0.06, delay: i * 0.10 });
        });
      },
      setMuted: function (v) { muted = v; },
      isMuted: function () { return muted; }
    };
  })();

  /* ===================== 抽题范围按钮 ===================== */
  function buildChips() {
    chipsEl.innerHTML = '';
    var list = [{ name: '全部', val: null }];
    BANK.forEach(function (c) { list.push({ name: c.name, val: c.name }); });
    list.forEach(function (it) {
      var b = document.createElement('button');
      b.className = 'chip' + (it.val === selectedCat ? ' on' : '');
      b.textContent = it.name;
      b.onclick = function () {
        selectedCat = it.val;
        used = {};                       // 换范围就重新开始一轮
        buildChips();
      };
      chipsEl.appendChild(b);
    });
  }

  /* ===================== 候选池 & 抽一题 ===================== */
  function candidates() {
    var cats = selectedCat === null
      ? BANK
      : BANK.filter(function (c) { return c.name === selectedCat; });
    var out = [];
    cats.forEach(function (c) {
      c.questions.forEach(function (q, i) {
        out.push({ q: q, cat: c.name, key: c.name + '#' + i });
      });
    });
    return out;
  }

  function drawOne() {
    var cands = candidates();
    if (!cands.length) return null;
    var fresh = cands.filter(function (x) { return !used[x.key]; });
    if (!fresh.length) { used = {}; fresh = cands; }   // 抽满一轮才重置
    var pick = fresh[Math.floor(Math.random() * fresh.length)];
    used[pick.key] = 1;
    return pick;
  }

  /* ===================== 卡片渲染 ===================== */
  function renderResult(item) {
    var raw = item.q;
    var q = (typeof raw === 'string') ? { q: raw } : raw;

    cardEl.innerHTML = '';

    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = '本题来自：' + item.cat;
    cardEl.appendChild(tag);

    var body = document.createElement('div');
    body.className = 'q';
    body.textContent = q.q || '';
    cardEl.appendChild(body);

    if (Object.prototype.toString.call(q.options) === '[object Array]' && q.options.length) {
      var ol = document.createElement('ol');
      ol.className = 'opts';
      q.options.forEach(function (opt, i) {
        var li = document.createElement('li');
        var b = document.createElement('b');
        b.textContent = String.fromCharCode(65 + i) + '.';
        li.appendChild(b);
        li.appendChild(document.createTextNode(opt));
        ol.appendChild(li);
      });
      cardEl.appendChild(ol);
    }

    if (q.src) {
      var srcEl = document.createElement('div');
      srcEl.className = 'src';
      srcEl.textContent = '来源：' + q.src;
      cardEl.appendChild(srcEl);

  }

  function fireConfetti() {
    var colors = ['#ff6b6b','#ffd166','#4f8cff','#34d399','#a78bfa','#f472b6','#22d3ee','#fb923c'];
    for (var i = 0; i < 42; i++) {

        d.style.setProperty('--rot', (Math.random() * 1000 - 500).toFixed(0) + 'deg');

  /* ===================== 扭蛋掉落（物理弹跳） ===================== */
  function dropCapsule(onSettled) {
    var colors = CAP_COLORS[Math.floor(Math.random() * CAP_COLORS.length)];
    if (colors === lastCapColor) {
      colors = CAP_COLORS[(CAP_COLORS.indexOf(colors) + 1) % CAP_COLORS.length];
    }
    lastCapColor = colors;
    capsule.style.setProperty('--c1', colors[0]);
    capsule.style.setProperty('--c2', colors[1]);

    // 瞬时复位上一轮的「爆开」状态，否则两半蛋壳会从半空中飞回来
    capsule.className = 'capsule show noanim';
    void capsule.offsetWidth;
    capsule.classList.remove('noanim');
    capsule.style.transform = 'translate(-50%,-52px)';

    var y = -52, v = 0;
    var G = 2400, FLOOR = 74, REST = 0.42;
    var last = 0, settled = false;

    function step(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000);
      last = now;

      v += G * dt;
      y += v * dt;

      if (y >= FLOOR) {
        y = FLOOR;
        if (Math.abs(v) > 130 && !settled) {
          v = -v * REST;
          Sound.bounce(Math.min(1, Math.abs(v) / 1000));
        } else {
          capsule.style.transform = 'translate(-50%,' + FLOOR + 'px)';
          if (!settled) { settled = true; onSettled(); }
          return;
        }
      }
      capsule.style.transform = 'translate(-50%,' + y.toFixed(1) + 'px)';
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ===================== 整个开奖流程 ===================== */
  function start() {
    if (busy) return;
    var item = drawOne();
    if (!item) { hintEl.textContent = '这个范围里没有题目'; return; }

    busy = true;
    pendingItem = item;
    Sound.unlock();
    knob.disabled = true;
    cardEl.classList.remove('show');
    cardEl.innerHTML = '';
    hintEl.textContent = '咔啦咔啦…';

    // 1) 转旋钮
    knobAngle += 360;
    knob.style.transform = 'rotate(' + knobAngle + 'deg)';
    Sound.turn();
    dome.classList.add('jiggle');
    setTimeout(function () { dome.classList.remove('jiggle'); }, 1050);

    // 2) 旋钮转完 → 落蛋
    setTimeout(function () {
      hintEl.textContent = '扭蛋掉出来了…';
      Sound.drop();
      dropCapsule(function () {
        // 3) 落定 → 摇晃蓄力
        hintEl.textContent = '要开啦…';
        capsule.classList.add('shake');
        Sound.rumble();

        // 4) 爆开
        setTimeout(function () {
          capsule.classList.remove('shake');
          capsule.classList.add('burst');
          Sound.pop();
          doFlash();
          fireConfetti();
          setTimeout(function () { Sound.fanfare(); }, 110);

          // 5) 揭晓题目
          setTimeout(function () {
            renderResult(pendingItem);
            hintEl.textContent = '再转一次旋钮';
            knob.disabled = false;
            busy = false;
          }, 460);
        }, 820);
      });
    }, 700);
  }

  /* ===================== 事件 ===================== */
  knob.addEventListener('click', start);

  muteEl.addEventListener('click', function () {
    var m = !Sound.isMuted();
    Sound.setMuted(m);
    muteEl.textContent = m ? '🔇' : '🔊';
    muteEl.classList.toggle('off', m);
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) Sound.unlock();
  });

  buildChips();
})();
</script>
</body>
</html>
