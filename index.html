  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background-color:#221c16;
    background-image:var(--tex-dark);
    background-size:40px 40px;
    image-rendering:pixelated;
    color:#e9e9e9;
    min-height:100vh;
    font:16px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:14px 16px calc(26px + env(safe-area-inset-bottom));
    overflow-x:hidden;
    letter-spacing:.3px;
  }

  h1{
    font-size:19px;font-weight:700;margin:2px 0 12px;letter-spacing:2px;
    color:#fff;
    text-shadow:3px 3px 0 rgba(0,0,0,.65), 0 0 12px rgba(120,200,90,.25);
  }

  /* ── 通用：MC 面板 / 按钮 / 格子 ── */
  .mc-panel{
    background:var(--gui);
    border:3px solid var(--edge);
    box-shadow:inset 3px 3px 0 var(--gui-lt), inset -3px -3px 0 var(--gui-dk);
    color:var(--ink);
  }

  /* ── 顶部页签 ── */
  .tabs{
    display:flex;gap:6px;margin:0 0 14px;padding:6px;
    width:100%;max-width:360px;
    background:#6f6f6f;
    border:3px solid var(--edge);
    box-shadow:inset 3px 3px 0 #8f8f8f, inset -3px -3px 0 #4a4a4a;
  }
  .tab{
    flex:1;border:3px solid var(--edge);background:var(--btm);
    color:#e8e8e8;font-size:14px;font-weight:700;padding:8px 0;
    cursor:pointer;font-family:inherit;letter-spacing:1px;
    box-shadow:inset 3px 3px 0 var(--btm-lt), inset -3px -3px 0 var(--btm-dk);
    text-shadow:2px 2px 0 rgba(0,0,0,.5);
    transition:none;
  }
  .tab:active{box-shadow:inset -3px -3px 0 var(--btm-lt), inset 3px 3px 0 var(--btm-dk)}
  .tab.on{
    background:var(--grass);color:#fff;
    box-shadow:inset 3px 3px 0 #8ecb6d, inset -3px -3px 0 #3f6b2c;
  }
  .view{width:100%;display:flex;flex-direction:column;align-items:center}
  .view[hidden]{display:none}

  /* ── 抽题范围 ── */
  .chips{
    display:flex;gap:6px;width:100%;max-width:360px;overflow-x:auto;
    padding:2px 2px 10px;scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:3px solid var(--edge);background:#7c7c7c;
    color:#e4e4e4;font-size:12.5px;font-weight:600;padding:5px 11px;
    white-space:nowrap;cursor:pointer;font-family:inherit;
    box-shadow:inset 3px 3px 0 #9d9d9d, inset -3px -3px 0 #4f4f4f;
    text-shadow:2px 2px 0 rgba(0,0,0,.45);
  }
  .chip:active{box-shadow:inset -3px -3px 0 #9d9d9d, inset 3px 3px 0 #4f4f4f}
  .chip.on{
    background:var(--grass);color:#fff;
    box-shadow:inset 3px 3px 0 #8ecb6d, inset -3px -3px 0 #3f6b2c;
  }

  /* ── 抽奖机（玻璃块 + 石台 + 石按钮 + 出物口）── */
  .machine{position:relative;width:260px;margin:2px auto 0;user-select:none}
  .machine::before{
    content:'';position:absolute;left:50%;top:10px;width:230px;height:230px;
    margin-left:-115px;pointer-events:none;
    background:radial-gradient(circle, rgba(120,200,90,.28), transparent 66%);
    filter:blur(16px);
  }

  .dome{
    position:relative;width:190px;height:190px;margin:0 auto -20px;
    background-image:var(--tex-glass);
    background-size:48px 48px;
    border:4px solid var(--edge);
    box-shadow:inset 4px 4px 0 rgba(255,255,255,.55), inset -4px -4px 0 rgba(0,0,0,.16);
    overflow:hidden;
  }
  .balls{position:absolute;inset:0}
  .balls span{
    position:absolute;
    border-radius:0 !important;
    border:2px solid rgba(0,0,0,.35);
    box-shadow:inset -3px -3px 0 rgba(0,0,0,.22), inset 3px 3px 0 rgba(255,255,255,.45);
  }
  .dome.jiggle .balls{animation:jig .5s linear 2}
  @keyframes jig{
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(-2.5px,1.5px)}
    75%{transform:translate(2.5px,-1.5px)}
  }

  .body{
    position:relative;width:248px;height:118px;margin:0 auto;
    background-image:var(--tex-cobble);
    background-size:40px 40px;
    border:4px solid var(--edge);
    box-shadow:inset 4px 4px 0 #b6b6b6, inset -4px -4px 0 #565656;
  }

  .knob{
    position:absolute;left:50%;top:16px;margin-left:-40px;
    width:80px;height:34px;border:3px solid var(--edge);padding:0;
    background:#9d9d9d;cursor:pointer;
    box-shadow:inset 3px 3px 0 #d2d2d2, inset -3px -3px 0 #6a6a6a;
    display:flex;align-items:center;justify-content:center;
    transition:transform .65s cubic-bezier(.35,1.5,.5,1);
  }
  .knob::before{
    content:'';width:38px;height:8px;background:#5d5d5d;
    box-shadow:inset 0 2px 0 rgba(0,0,0,.5);
  }
  .knob:active{box-shadow:inset -3px -3px 0 #d2d2d2, inset 3px 3px 0 #6a6a6a}
  .knob:disabled{cursor:default;filter:brightness(.85)}

  .chute{
    position:absolute;left:50%;bottom:12px;margin-left:-42px;
    width:84px;height:32px;background:#141414;
    border:3px solid var(--edge);
    box-shadow:inset 3px 3px 0 rgba(0,0,0,.85);
  }
  .chute::after{
    content:'';position:absolute;left:8px;right:8px;bottom:5px;height:4px;
    background:rgba(255,255,255,.10);
  }

  /* ── 掉落区 ── */
  .dropzone{position:relative;width:100%;max-width:360px;height:118px;margin-top:2px}
  .tray{
    position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    width:140px;height:10px;background:rgba(0,0,0,.4);
    border:2px solid rgba(0,0,0,.5);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.08);
  }

  .capsule{
    position:absolute;left:50%;top:0;width:58px;height:58px;
    transform:translate(-50%,-52px);opacity:0;pointer-events:none;
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));
  }
  .capsule.show{opacity:1}
  .cap-half{
    position:absolute;left:0;width:58px;height:29px;
    transition:transform .5s ease-out, opacity .5s;
    border:3px solid var(--edge);
  }
  .cap-top{top:0;border-bottom:0;background:var(--c1)}
  .cap-bot{bottom:0;border-top:0;background:var(--c2)}
  .capsule::after{
    content:'';position:absolute;left:2px;right:2px;top:25px;height:7px;
    background:rgba(0,0,0,.35);
  }
  .capsule.shake{animation:cshake .09s linear infinite}
  @keyframes cshake{
    0%{transform:translate(-50%,74px)}
    50%{transform:translate(-50%,71px)}
    100%{transform:translate(-50%,74px)}
  }
  .capsule.burst .cap-top{transform:translate(-44px,-52px) rotate(-35deg);opacity:0}
  .capsule.burst .cap-bot{transform:translate(44px,52px) rotate(35deg);opacity:0}
  .capsule.burst::after{opacity:0;transition:opacity .2s}

  .flash{
    position:absolute;left:50%;top:74px;width:20px;height:20px;margin:-10px 0 0 -10px;
    background:#fff;opacity:0;pointer-events:none;
  }
  .flash.go{animation:flash .62s steps(6) 1}
  @keyframes flash{
    0%{opacity:0;transform:scale(.3)}
    22%{opacity:1;transform:scale(3.4)}
    100%{opacity:0;transform:scale(9)}
  }

  .confetti{position:absolute;left:50%;top:74px;width:0;height:0;pointer-events:none}
  .confetti i{
    position:absolute;left:0;top:0;width:9px;height:9px;
    animation:fly .95s cubic-bezier(.2,.7,.4,1) forwards;
  }
  @keyframes fly{
    0%{transform:translate(-50%,-50%) rotate(0) scale(.4);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1);opacity:0}
  }

  /* ── 状态行 ── */
  .meta{color:#a8a8a8;font-size:12.5px;text-align:center;margin-top:10px;
        text-shadow:2px 2px 0 rgba(0,0,0,.5)}
  .meta b{color:var(--gold);font-weight:700}
  .hint{color:#c9c9c9;font-size:13px;text-align:center;min-height:20px;margin-top:4px;
        text-shadow:2px 2px 0 rgba(0,0,0,.5)}

  /* ── 题目卡 ── */
  .card{
    width:100%;max-width:360px;margin-top:14px;padding:14px;
    background-image:var(--tex-paper);background-size:32px 32px;
    background-color:#e4dfd2;
    border:3px solid var(--edge);
    box-shadow:inset 3px 3px 0 rgba(255,255,255,.75), inset -3px -3px 0 var(--gui-dk);
    color:var(--ink);display:none;
  }
  .card.show{display:block}

  .tag{
    display:inline-block;font-size:11.5px;font-weight:700;color:#fff;
    background:#6f7f9e;padding:2px 9px;margin-bottom:10px;
    border:2px solid var(--edge);
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.28);
    text-shadow:1px 1px 0 rgba(0,0,0,.45);
  }
  .q{font-size:16px;line-height:1.75;white-space:pre-wrap;word-break:break-word;color:#2f2f2f}
  .gitem{
    display:flex;gap:8px;padding:9px 10px;margin-top:7px;
    background:rgba(0,0,0,.045);border:2px solid #b0b0b0;
    font-size:14.5px;line-height:1.65;color:#232323;
  }
  .gitem b{color:#1f4fa8;flex:0 0 auto;font-weight:700}
  .opts{list-style:none;padding:0;margin:12px 0 0}
  .opts li{
    padding:8px 10px;margin-top:7px;font-size:14.5px;line-height:1.6;
    background:var(--slot);border:2px solid var(--slot-dk);
    box-shadow:inset 2px 2px 0 #5f5f5f, inset -2px -2px 0 #a9a9a9;
    color:#1f1f1f;word-break:break-word;
  }
  .opts li b{color:#1f4fa8;margin-right:6px;font-weight:700}
  .src{
    margin-top:12px;padding-top:9px;border-top:3px solid #a9a9a9;
    font-size:11.5px;color:var(--ink2);
  }
  .hintbtn{
    margin-top:12px;border:3px solid var(--edge);background:#7d8ba8;color:#fff;
    font-size:12.5px;font-weight:700;padding:6px 11px;cursor:pointer;font-family:inherit;
    box-shadow:inset 3px 3px 0 #9fadc8, inset -3px -3px 0 #55617a;
    text-shadow:1px 1px 0 rgba(0,0,0,.5);
  }
  .hintbtn:active{box-shadow:inset -3px -3px 0 #9fadc8, inset 3px 3px 0 #55617a}

  /* 打分 */
  .scorebar{margin-top:12px;padding-top:10px;border-top:3px solid #a9a9a9}
  .scorelab{font-size:12px;color:var(--ink2);font-weight:700}
  .scorebtns{display:flex;gap:5px;margin-top:8px}
  .sbtn{
    flex:1;height:36px;border:3px solid var(--edge);padding:0;
    background:var(--btm);color:#fff;font-size:14px;font-weight:700;
    font-family:inherit;cursor:pointer;
    box-shadow:inset 3px 3px 0 var(--btm-lt), inset -3px -3px 0 var(--btm-dk);
    text-shadow:2px 2px 0 rgba(0,0,0,.45);
  }
  .sbtn:active{box-shadow:inset -3px -3px 0 var(--btm-lt), inset 3px 3px 0 var(--btm-dk)}
  .sbtn.on{
    background:var(--green);color:#fff;
    box-shadow:inset 3px 3px 0 #7cc45c, inset -3px -3px 0 #2f6b20;
  }
  .sbtn-custom{flex:1.7 1 0;font-size:12px;background:#7d8ba8;
               box-shadow:inset 3px 3px 0 #9fadc8, inset -3px -3px 0 #55617a}
  .scoretip{margin-top:8px;font-size:12.5px;color:var(--ink2);min-height:16px;font-weight:600}

  /* ── 潘多拉魔盒（MC 箱子）── */
  .pbox{
    position:fixed;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));
    z-index:8;width:66px;height:62px;border:0;padding:0;background:none;
    cursor:pointer;filter:drop-shadow(0 6px 0 rgba(0,0,0,.45));
  }
  .pbox-lid{
    position:absolute;left:0;right:0;top:0;height:24px;
    background-image:var(--tex-plank);background-size:32px 32px;
    border:3px solid var(--edge);
    box-shadow:inset 3px 3px 0 rgba(255,255,255,.25), inset -3px -3px 0 rgba(0,0,0,.28);
    transition:transform .2s steps(2);
  }
  .pbox-body{
    position:absolute;left:0;right:0;top:21px;bottom:0;
    background-image:var(--tex-plank);background-size:32px 32px;
    filter:brightness(.82);
    border:3px solid var(--edge);
    box-shadow:inset 3px 3px 0 rgba(255,255,255,.18), inset -3px -3px 0 rgba(0,0,0,.3);
  }
  .pbox-body::after{
    content:'';position:absolute;left:50%;top:-4px;margin-left:-6px;
    width:12px;height:14px;background:#c9c9c9;border:2px solid var(--edge);
  }
  .pbox:active .pbox-lid{transform:translateY(-5px) rotate(-4deg)}
  .pbox-n{
    position:absolute;right:-5px;top:-5px;min-width:24px;height:24px;padding:0 5px;
    display:flex;align-items:center;justify-content:center;
    background:#c0392b;color:#fff;font-size:12px;font-weight:700;
    border:3px solid var(--edge);
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.3);
    text-shadow:1px 1px 0 rgba(0,0,0,.5);
  }
  .pbox-n[data-zero="1"]{background:#5a5a5a;color:#c9c9c9}

  /* ── 魔盒面板 ── */
  .overlay{
    position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.62);
    display:none;align-items:flex-end;justify-content:center;
  }
  .overlay.on{display:flex}
  .sheet{
    width:100%;max-width:430px;max-height:84vh;display:flex;flex-direction:column;
    background-image:var(--tex-paper);background-size:32px 32px;
    background-color:#e4dfd2;
    border:4px solid var(--edge);
    box-shadow:inset 4px 4px 0 rgba(255,255,255,.75), inset -4px -4px 0 var(--gui-dk);
  }
  .sheet-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 14px;font-size:14px;font-weight:700;color:#2f2f2f;
    background:var(--gui);border-bottom:3px solid #9a9a9a;
  }
  .sheet-head b{color:#a03a00}
  .sheet-x{
    width:30px;height:30px;border:3px solid var(--edge);background:#a9a9a9;
    color:#2f2f2f;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
    box-shadow:inset 2px 2px 0 #cccccc, inset -2px -2px 0 #6a6a6a;
  }
  .sheet-x:active{box-shadow:inset -2px -2px 0 #cccccc, inset 2px 2px 0 #6a6a6a}
  .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;flex:1}
  .ditem{
    padding:11px;margin-bottom:10px;color:var(--ink);
    background:#b9b9b9;border:3px solid var(--edge);
    box-shadow:inset 3px 3px 0 #d6d6d6, inset -3px -3px 0 #8f8f8f;
  }
  .dtop{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
  .dtag{
    font-size:10.5px;font-weight:700;color:#fff;background:#6f7f9e;
    padding:1px 7px;border:2px solid var(--edge);
    box-shadow:inset 1px 1px 0 rgba(255,255,255,.35);
  }
  .dtime{font-size:10.5px;color:#5f5f5f;font-weight:600}
  .dq{font-size:14px;line-height:1.6;color:#232323;word-break:break-word}
  .dsrc{font-size:11px;color:#5f5f5f;margin-top:6px}
  .dscore{
    margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 7px;
    border:2px solid var(--edge);white-space:nowrap;
  }
  .dscore.s-none{background:#9a9a9a;color:#4a4a4a}
  .dscore.s-lo{background:#c0564a;color:#fff}
  .dscore.s-mid{background:#d9a92f;color:#2b2200}
  .dscore.s-hi{background:#5aa33c;color:#fff}
  .dscores{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
  .dsb{
    flex:1 1 0;height:30px;padding:0;border:2px solid var(--edge);
    background:var(--slot);color:#1f1f1f;font-size:12px;font-weight:700;
    font-family:inherit;cursor:pointer;
    box-shadow:inset 2px 2px 0 #5f5f5f, inset -2px -2px 0 #a9a9a9;
  }
  .dsb.on{background:var(--green);color:#fff;
          box-shadow:inset 2px 2px 0 #7cc45c, inset -2px -2px 0 #2f6b20}
  .dacts{display:flex;gap:4px;margin-top:5px}
  .dacts button{
    flex:1 1 0;height:30px;padding:0;border:2px solid var(--edge);
    font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;
    white-space:nowrap;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.4);
  }
  .dx3{background:#6f7f9e;box-shadow:inset 2px 2px 0 #93a2bf, inset -2px -2px 0 #4d5871}
  .dx4{background:#b89337;box-shadow:inset 2px 2px 0 #d4b567, inset -2px -2px 0 #86691f}
  .dx2{background:#a8554a;box-shadow:inset 2px 2px 0 #c47a70, inset -2px -2px 0 #77372e}
  .dacts button:active{box-shadow:inset -2px -2px 0 rgba(255,255,255,.3)}
  .sheet-empty{text-align:center;color:#5f5f5f;font-size:13.5px;padding:44px 0;line-height:2}
  .dsum{font-size:11px;font-weight:600;color:#5f5f5f}
  .sheet-foot{
    display:flex;gap:8px;padding:11px 12px calc(14px + env(safe-area-inset-bottom));
    border-top:3px solid #9a9a9a;
  }
  .undo{
    flex:0 0 auto;padding:0 14px;height:40px;border:3px solid var(--edge);
    background:#a9a9a9;color:#2f2f2f;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;
    box-shadow:inset 3px 3px 0 #cccccc, inset -3px -3px 0 #6a6a6a;
  }
  .undo:active:not(:disabled){box-shadow:inset -3px -3px 0 #cccccc, inset 3px 3px 0 #6a6a6a}
  .undo:disabled{opacity:.45;cursor:default}
  .exbtn{color:#8a6d10}
  .reset{
    flex:1;height:40px;border:3px solid var(--edge);background:#a8554a;color:#fff;
    font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
    box-shadow:inset 3px 3px 0 #c47a70, inset -3px -3px 0 #77372e;
    text-shadow:2px 2px 0 rgba(0,0,0,.4);
  }
  .reset:active{box-shadow:inset -3px -3px 0 #c47a70, inset 3px 3px 0 #77372e}

  /* ── 套题 ── */
  .pbar{width:100%;max-width:360px;margin-bottom:14px}
  .pbtn{
    width:100%;border:3px solid var(--edge);padding:13px;font-size:16px;font-weight:700;
    color:#fff;background:var(--grass);cursor:pointer;font-family:inherit;
    box-shadow:inset 3px 3px 0 #8ecb6d, inset -3px -3px 0 #3f6b2c;
    text-shadow:2px 2px 0 rgba(0,0,0,.45);letter-spacing:1px;
  }
  .pbtn:active{box-shadow:inset -3px -3px 0 #8ecb6d, inset 3px 3px 0 #3f6b2c}
  .pbtn.ghost{
    width:auto;background:#8b8b8b;box-shadow:inset 3px 3px 0 #b9b9b9, inset -3px -3px 0 #5a5a5a;
    font-size:12px;padding:8px 12px;
  }
  #paper{width:100%;max-width:360px}
  .psec{margin-bottom:18px}
  .psec h3{
    font-size:13.5px;font-weight:700;margin:0 0 9px;color:#fff;
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    text-shadow:2px 2px 0 rgba(0,0,0,.6);letter-spacing:1px;
  }
  .psec h3 em{font-style:normal;font-size:11px;font-weight:600;color:var(--gold);white-space:nowrap}
  .pq{
    position:relative;display:flex;gap:9px;padding:11px;margin-bottom:8px;
    background-image:var(--tex-paper);background-size:32px 32px;
    background-color:#e4dfd2;
    border:3px solid var(--edge);color:var(--ink);
    box-shadow:inset 3px 3px 0 rgba(255,255,255,.75), inset -3px -3px 0 var(--gui-dk);
  }
  .pqno{
    flex:0 0 24px;height:24px;font-size:12px;font-weight:700;color:#1f1f1f;
    display:flex;align-items:center;justify-content:center;
    background:var(--slot);border:2px solid var(--slot-dk);
    box-shadow:inset 2px 2px 0 #5f5f5f, inset -2px -2px 0 #a9a9a9;
  }
  .pqbody{flex:1;min-width:0}
  .pqtext{font-size:14px;line-height:1.66;word-break:break-word;color:#232323}
  .pqsrc{font-size:10.5px;color:#5f5f5f;margin-top:5px}
  .pqhint{
    font-size:12px;line-height:1.6;color:#1f2f4a;margin-top:8px;padding:8px 9px;
    background:#b9c8de;border:2px solid #6a7a92;
    box-shadow:inset 2px 2px 0 #d3dfee;
  }
  .pqacts{flex:0 0 auto;display:flex;flex-direction:column;gap:5px}
  .pqre,.pqhi{
    border:2px solid var(--edge);background:#7d8ba8;color:#fff;
    font-size:10.5px;font-weight:700;padding:4px 7px;cursor:pointer;
    font-family:inherit;white-space:nowrap;
    box-shadow:inset 2px 2px 0 #9fadc8, inset -2px -2px 0 #55617a;
    text-shadow:1px 1px 0 rgba(0,0,0,.45);
  }
  .pqre:active,.pqhi:active{box-shadow:inset -2px -2px 0 #9fadc8, inset 2px 2px 0 #55617a}
  .pempty{text-align:center;color:#a8a8a8;font-size:13px;padding:40px 0;line-height:2}

  /* ── 题库 ── */
  .bbar{
    width:100%;max-width:360px;display:flex;justify-content:space-between;
    align-items:center;margin-bottom:10px;gap:10px;
  }
  #bankCount{font-size:12px;font-weight:700;color:#d0d0d0;text-shadow:2px 2px 0 rgba(0,0,0,.5)}
  #bankList{width:100%;max-width:360px}
  .bsec{
    margin-bottom:9px;background:var(--gui);border:3px solid var(--edge);
    box-shadow:inset 3px 3px 0 var(--gui-lt), inset -3px -3px 0 var(--gui-dk);
  }
  .bhead{
    width:100%;border:0;background:none;color:#2f2f2f;font-family:inherit;
    font-size:13px;font-weight:700;padding:11px 12px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .bhead:active{background:#b5b5b5}
  .bhead em{font-style:normal;font-size:11px;font-weight:600;color:#5f5f5f;white-space:nowrap}
  .blist{border-top:3px solid #9a9a9a;max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .brow{
    display:flex;gap:8px;align-items:center;padding:8px 11px;
    border-bottom:2px dashed #a5a5a5;
  }
  .brow:last-child{border-bottom:0}
  .brow.off{opacity:.45}
  .brow.off .bt{text-decoration:line-through}
  .bt{flex:1;font-size:12px;line-height:1.5;word-break:break-word;color:#2b2b2b}
  .bdel{
    flex:0 0 auto;border:2px solid var(--edge);background:#a8554a;color:#fff;
    font-size:10.5px;font-weight:700;padding:4px 8px;cursor:pointer;font-family:inherit;
    white-space:nowrap;
    box-shadow:inset 2px 2px 0 #c47a70, inset -2px -2px 0 #77372e;
    text-shadow:1px 1px 0 rgba(0,0,0,.4);
  }
  .bdel:active{box-shadow:inset -2px -2px 0 #c47a70, inset 2px 2px 0 #77372e}
  .bdel.on{
    background:var(--green);
    box-shadow:inset 2px 2px 0 #7cc45c, inset -2px -2px 0 #2f6b20;
  }

  /* ── 血条 / 经验条 ── */
  .hud{
    width:100%;max-width:360px;display:flex;flex-direction:column;gap:7px;margin-bottom:12px;
  }
  .hearts{display:flex;gap:2px;height:18px}
  .hearts i{
    width:18px;height:18px;background-size:100% 100%;background-repeat:no-repeat;
    image-rendering:pixelated;
  }
  .xp{
    position:relative;height:18px;background:#241f19;border:3px solid var(--edge);
    box-shadow:inset 2px 2px 0 #000, inset -2px -2px 0 #4a4a4a;
  }
  .xpfill{
    position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(180deg,#a4e06a,#4e9a35);
    transition:width .35s;
  }
  .xplab{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;color:#fff;letter-spacing:.5px;
    text-shadow:1px 1px 0 #000, -1px -1px 0 #000;
  }

  /* ── 物品栏格子 ── */
  .blist.grid{
    display:grid;grid-template-columns:repeat(9,1fr);gap:2px;
    padding:6px;max-height:60vh;overflow-y:auto;
  }
  .bslot{
    position:relative;height:36px;padding:0;cursor:pointer;font-family:inherit;
    background:#8b8b8b;border:2px solid var(--slot-dk);
    box-shadow:inset 2px 2px 0 #5f5f5f, inset -2px -2px 0 #a9a9a9;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .bslot.off{background:#4a4a4a;opacity:.5}
  .bslot:active{box-shadow:inset -2px -2px 0 #5f5f5f, inset 2px 2px 0 #a9a9a9}
  .bsi{
    width:13px;height:15px;background:#e9dfc4;border:1px solid #6f6247;
    position:relative;flex:0 0 auto;
  }
  .bsi::after{
    content:'';position:absolute;left:2px;right:2px;top:3px;height:1px;
    background:#b3a888;box-shadow:0 3px 0 #b3a888, 0 6px 0 #b3a888;
  }
  .bsl{font-size:9px;font-weight:700;color:#1f1f1f;line-height:1;margin-top:1px}
  .bslot.off .bsl{text-decoration:line-through;color:#9a9a9a}
  .reset.on{
    background:var(--green);
    box-shadow:inset 3px 3px 0 #8ecb6d, inset -3px -3px 0 #3f6b2c;
  }

  /* ── 音效开关 ── */
  .mute{
    position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:9;
    width:38px;height:38px;border:3px solid var(--edge);background:#8b8b8b;
    color:#fff;font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 3px 3px 0 #b9b9b9, inset -3px -3px 0 #5a5a5a;
  }
  .mute:active{box-shadow:inset -3px -3px 0 #b9b9b9, inset 3px 3px 0 #5a5a5a}
  .mute.off{background:#a8554a;box-shadow:inset 3px 3px 0 #c47a70, inset -3px -3px 0 #77372e}

  /* ── 轻提示 ── */
  .toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);
    z-index:40;padding:9px 15px;font-size:12.5px;font-weight:700;
    background:rgba(20,20,20,.94);color:#fff;border:3px solid var(--edge);
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.18);
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
    white-space:nowrap;text-shadow:2px 2px 0 rgba(0,0,0,.6);
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="mute" id="mute" title="音效开关">🔊</div>

<h1 id="title">扭蛋抽题</h1>

<nav class="tabs" id="tabs">
  <button class="tab on" data-view="pull">扭蛋</button>
  <button class="tab" data-view="paper">套题</button>
  <button class="tab" data-view="bank">题库</button>
</nav>

<div class="hud">
  <div class="hearts" id="hearts"></div>
  <div class="xp"><div class="xpfill" id="xpfill"></div><span class="xplab" id="xplab">已做 0 / 0</span></div>
</div>

<div class="view" id="view-pull">

<div class="chips" id="chips"></div>

<div class="machine">
  <div class="dome" id="dome"><div class="balls" id="balls"></div></div>
  <div class="body">
    <button class="knob" id="knob" aria-label="转动旋钮抽题"></button>
    <div class="chute"></div>
  </div>
</div>

<div class="dropzone">
  <div class="tray"></div>
  <div class="flash" id="flash"></div>
  <div class="confetti" id="confetti"></div>
  <div class="capsule" id="capsule">
    <span class="cap-half cap-top"></span>
    <span class="cap-half cap-bot"></span>
  </div>
</div>

<div class="meta" id="meta"></div>
<div class="hint" id="hint">转动旋钮，抽一颗扭蛋</div>
<div class="card" id="card"></div>
</div><!-- /view-pull -->

<div class="view" id="view-paper" hidden>
  <div class="pbar">
    <button class="pbtn" id="newPaper">生成一套题</button>
  </div>
  <div id="paper"></div>
</div>

<div class="view" id="view-bank" hidden>
  <div class="bbar">
    <span id="bankCount"></span>
    <button class="pbtn ghost" id="bankModeBtn">列表</button>
    <button class="pbtn ghost" id="restoreAll" style="display:none">恢复已删除的题</button>
  </div>
  <div id="bankList"></div>
</div>

<!-- 潘多拉魔盒 -->
<button class="pbox" id="pbox" aria-label="潘多拉魔盒：查看做过的题">
  <span class="pbox-lid"></span>
  <span class="pbox-body"></span>
  <span class="pbox-n" id="pboxN" data-zero="1">0</span>
</button>

<div class="overlay" id="bd">
  <div class="sheet">
    <div class="sheet-head"><span id="bdHead">题目</span><button class="sheet-x" id="bdX">✕</button></div>

  /* ===================== 音效（Web Audio 合成，不依赖任何音频文件）===== */
  var Sound = (function () {
    var ctx = null, master = null, muted = false;
    var VOLUME = 2.2;          // 总音量倍数：比原来的 0.07 增益响约 8 倍

    function ac() {
      if (!ctx) {
        // iOS 16.4+：把音频会话声明为 playback，这样手机开着静音拨片也能出声
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}

        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        try { ctx = new C(); } catch (e) { return null; }

        // 主音量 + 压缩器：既够响，又不会削波爆音
        master = ctx.createGain();
        master.gain.value = VOLUME;
        var comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -18;
        comp.knee.value = 30;
        comp.ratio.value = 12;
        comp.attack.value = 0.003;
        comp.release.value = 0.22;

        // 柔和限幅：把峰值压进 ±1，避免小号声爆音
        var shaper = ctx.createWaveShaper();
        var N = 1024, curve = new Float32Array(N), KNEE = 0.7;
        for (var i = 0; i < N; i++) {
          var x = (i / (N - 1)) * 2 - 1, a = Math.abs(x);
          curve[i] = a <= KNEE ? x
            : (x < 0 ? -1 : 1) * (KNEE + (1 - KNEE) * Math.tanh((a - KNEE) / (1 - KNEE)));
        }
        shaper.curve = curve;
        shaper.oversample = '2x';

        master.connect(comp);
        comp.connect(shaper);
        shaper.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
      return ctx;
    }

    function tone(o) {
      if (muted) return;
      var c = ac(); if (!c || !master) return;
      var t0 = c.currentTime + (o.delay || 0);
      var dur = o.dur || 0.15;
      var osc = c.createOscillator(), g = c.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.freq, t0);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(o.gain || 0.3, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0 + dur + 0.04);
    }

    function noise(o) {
      if (muted) return;
      var c = ac(); if (!c || !master) return;
      var t0 = c.currentTime + (o.delay || 0);
      var dur = o.dur || 0.25;
      var len = Math.max(1, Math.floor(c.sampleRate * dur));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, o.decay || 2.5);
      }
      var src = c.createBufferSource(); src.buffer = buf;
      var f = c.createBiquadFilter();
      f.type = o.filter || 'bandpass';
      f.frequency.value = o.freq || 1200;
      f.Q.value = 0.8;
      var g = c.createGain(); g.gain.value = o.gain || 0.4;
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0);
    }

    return {
      unlock: function () { ac(); },
      /* 解锁确认音：让用户知道他点对了、声音也在 */
      ding: function () {
        tone({ freq: 880, dur: 0.16, type: 'sine', gain: 0.32 });
        tone({ freq: 1320, dur: 0.22, type: 'sine', gain: 0.20, delay: 0.06 });
      },

        }
      },
      drop: function () {
        tone({ freq: 420, to: 130, dur: 0.35, type: 'sine', gain: 0.55 });
        noise({ dur: 0.12, freq: 500, gain: 0.25, decay: 3 });
      },
      bounce: function (p) {

        noise({ dur: 0.07, freq: 1100, gain: 0.22, decay: 4 });

      },
      pop: function () {

        tone({ freq: 680, to: 2100, dur: 0.24, type: 'square', gain: 0.34 });

  (function fillDome() {

  function domeReset() {

    domeBalls.forEach(function (b) {

  function domeKick(power) {
    domeBalls.forEach(function (b) {
      b.vx += (Math.random() - 0.5) * power;
      b.vy -= Math.random() * power * 0.8;
    });
  }

  function domeStep(dt) {
    var W = domeW, H = domeH;
    if (!W || !H) return;
    var G = 950, REST = 0.55, i, j;

    for (i = 0; i < domeBalls.length; i++) {
      var b = domeBalls[i];
      b.vy += G * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx) * REST; }
      if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * REST; }
      if (b.y + b.r > H) {
        b.y = H - b.r;
        b.vy = -Math.abs(b.vy) * REST;
        if (Math.abs(b.vy) < 30) b.vy = 0;
        b.vx *= 0.9;
      }
      if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy) * REST; }
    }

    // 两两分离（按圆近似，方块视觉上够用）
    for (i = 0; i < domeBalls.length; i++) {
      for (j = i + 1; j < domeBalls.length; j++) {
        var a = domeBalls[i], c = domeBalls[j];
        var dx = c.x - a.x, dy = c.y - a.y;
        var d2 = dx * dx + dy * dy;
        var minD = a.r + c.r;
        if (d2 > 0.01 && d2 < minD * minD) {
          var d = Math.sqrt(d2);
          var nx = dx / d, ny = dy / d;
          var ov = (minD - d) * 0.5;
          a.x -= nx * ov; a.y -= ny * ov;
          c.x += nx * ov; c.y += ny * ov;
          var vn = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
          if (vn < 0) {
            var imp = -(1 + REST) * vn * 0.5;
            a.vx -= imp * nx; a.vy -= imp * ny;
            c.vx += imp * nx; c.vy += imp * ny;
          }
        }
      }
    }

    // 机器一直在轻微震动：随机推一下某个方块
    if (Math.random() < 0.09) {
      var k = domeBalls[(Math.random() * domeBalls.length) | 0];
      k.vx += (Math.random() - 0.5) * 130;
      k.vy -= Math.random() * 100;
    }
  }

  function paintSheet() {
    var keepTop = doneList.scrollTop;
    doneN.textContent = done.length;
    var scored = done.filter(function (d) { return typeof d.score === 'number'; });
    var rate = 0;
    scored.forEach(function (d) { rate += d.score / fullOfRec(d); });
    doneSum.textContent = scored.length
      ? ' · 得分率 ' + Math.round(rate / scored.length * 100) + '%（已评 ' + scored.length + ' 题）'
      : ' · 还没打分';
    var exN = Object.keys(excluded).length;
    exBtn.style.display = exN ? '' : 'none';
    exNEl.textContent = exN;
    if (!done.length) {
      doneList.innerHTML = '<div class="sheet-empty">魔盒还是空的<br>抽过的题会收在这里</div>';
      doneList.scrollTop = keepTop;
      return;
    }
    var html = '';
    for (var i = done.length - 1; i >= 0; i--) {
      var d = done[i];
      var q = d.q;
      var src = (typeof q === 'object' && q && q.src) ? q.src : '';
      var t = new Date(d.t || Date.now());
      var hm = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2);
      html += '<div class="ditem">' +
                '<div class="dtop"><span class="dtag">' + esc(d.cat) + '</span>' +
                '<span class="dtime">' + hm + '</span>' +
                '<span class="dscore ' + scoreClass(d.score, fullOfRec(d)) + '">' +
                (d.score === undefined || d.score === null
                  ? '未评分'
                  : (d.score > fullOfRec(d)
                      ? fmtNum(d.score) + ' 分'
                      : fmtNum(d.score) + ' / ' + fullOfRec(d))) +
                '</span></div>' +
                '<div class="dscores">' +
                stepsOfRec(d).map(function (v) {
                  return '<button class="dsb' + (d.score === v ? ' on' : '') +
                         '" data-i="' + i + '" data-v="' + v + '">' + fmtNum(v) + '</button>';
                }).join('') +
                '</div>' +
                '<div class="dacts">' +
                '<button class="dx3" data-i="' + i + '">填分</button>' +
                '<button class="dx4" data-i="' + i + '">不再出现</button>' +
                '<button class="dx2" data-i="' + i + '">放回池子</button>' +
                '</div>' +
                '<div class="dq">' + esc(qtext(q)) + '</div>' +
                (src ? '<div class="dsrc">来源：' + esc(src) + '</div>' : '') +
              '</div>';
    }
    doneList.innerHTML = html;
    doneList.scrollTop = keepTop;
  }

  function openSheet() {
    paintSheet();
    paintUndo();
    overlayEl.classList.add('on');
  }
  function closeSheet() { overlayEl.classList.remove('on'); }

  /* ===================== 卡片渲染 ===================== */
  function renderResult(item) {
    var raw = item.q;
    var q = (typeof raw === 'string') ? { q: raw } : raw;

    cardEl.innerHTML = '';

    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = '本题来自：' + item.cat;
    cardEl.appendChild(tag);

    var body = document.createElement('div');
    body.className = 'q';
    body.textContent = q.q || '';
    cardEl.appendChild(body);

    if (Object.prototype.toString.call(q.options) === '[object Array]' && q.options.length) {
      var ol = document.createElement('ol');
      ol.className = 'opts';
      q.options.forEach(function (opt, i) {
        var li = document.createElement('li');
        var b = document.createElement('b');
        b.textContent = String.fromCharCode(65 + i) + '.';
        li.appendChild(b);
        li.appendChild(document.createTextNode(opt));
        ol.appendChild(li);
      });
      cardEl.appendChild(ol);
    }

    if (q.src) {
      var srcEl = document.createElement('div');
      srcEl.className = 'src';
      srcEl.textContent = '来源：' + q.src;
      cardEl.appendChild(srcEl);
    }

    if (q.hint) {
      var hb = document.createElement('button');
      hb.className = 'hintbtn';
      hb.textContent = '看答题要点';
      var hd = document.createElement('div');
      hd.className = 'pqhint';
      hd.style.display = 'none';
      hd.textContent = q.hint;
      hb.onclick = function () {
        var open = hd.style.display === 'none';
        hd.style.display = open ? '' : 'none';
        hb.textContent = open ? '收起要点' : '看答题要点';
      };
      cardEl.appendChild(hb);
      cardEl.appendChild(hd);
    }

    cardEl.appendChild(scoreBar(item));

    cardEl.classList.add('show');
    try { cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
  }

  /* ===================== 打分 =====================
     不同题型满分不同：名词解释 2 分制，问答题 15 分制。
     分数允许 0.5 这种小数。 */
  function fullOf(cat) {
    cat = cat || '';
    if (cat.indexOf('中西') === 0) return 10;      // 中西名词解释：10 分制
    return /^名解/.test(cat) ? 2 : 15;
  }
  function stepsFor(cat) {
    cat = cat || '';
    if (cat.indexOf('中西') === 0) return [0, 2, 4, 6, 8, 10];
    return /^名解/.test(cat) ? [0, 0.5, 1, 1.5, 2] : [0, 3, 6, 9, 12, 15];
  }
  function fmtNum(v) {
    if (v === null || v === undefined || v === '') return '';
    return String(Math.round(Number(v) * 10) / 10);
  }

  function scoreBar(item, full, steps) {
    full = full || fullOf(item.cat);
    steps = steps || stepsFor(item.cat);
    var wrap = document.createElement('div');
    wrap.className = 'scorebar';

    var lab = document.createElement('span');
    lab.className = 'scorelab';
    lab.textContent = '这题给自己打几分？（满分 ' + full + ' 分）';
    wrap.appendChild(lab);

    var row = document.createElement('div');
    row.className = 'scorebtns';
    steps.forEach(function (v) {
      var b = document.createElement('button');
      b.className = 'sbtn';
      b.setAttribute('data-v', v);
      b.textContent = fmtNum(v);
      b.onclick = function () { setScore(item.key, v); };
      row.appendChild(b);
    });
    var cb = document.createElement('button');
    cb.className = 'sbtn sbtn-custom';
    cb.textContent = '自己填';
    cb.onclick = function () { askScore(item.key); };
    row.appendChild(cb);

    wrap.appendChild(row);

    var tip = document.createElement('div');
    tip.className = 'scoretip';
    wrap.appendChild(tip);
    return wrap;
  }

  /* 自己填分数（不限 0–5，任何非负整数都行） */
  function askScore(key) {
    var rec = findRec(key);
    var cur = (rec && typeof rec.score === 'number') ? String(rec.score) : '';
    var v = window.prompt('填这一题的分数（非负整数）', cur);
    if (v === null) return;
    v = String(v).replace(/[^0-9.]/g, '');
    var n = parseFloat(v);
    if (v === '' || isNaN(n)) return;
    setScore(key, Math.max(0, Math.round(n * 10) / 10));
  }

  function findRec(key) {
    for (var i = 0; i < done.length; i++) if (done[i].key === key) return done[i];
    return null;
  }

  function setScore(key, v) {
    var rec = findRec(key);
    if (!rec) return;
    rec.score = v;
    doneMap[key] = 1;
    saveDone();
    paintBox();
    paintMeta();

    var bar = cardEl.querySelector('.scorebtns');
    if (bar) {
      [].forEach.call(bar.children, function (b) {
        var bv = parseInt(b.getAttribute('data-v'), 10);
        b.classList.toggle('on', bv === v);
      });
    }
    var tip = cardEl.querySelector('.scoretip');
    if (tip) {
      var full = fullOfRec(rec), ratio = v / full;
      tip.textContent = '已记录 ' + fmtNum(v) + ' / ' + full + ' 分' +
        (ratio >= 0.8 ? ' · 记得很牢' : ratio >= 0.5 ? ' · 还要再练' : ' · 基本没记住');
    }
    if (overlayEl.classList.contains('on')) paintSheet();   // 魔盒开着就同步
  }

  function scoreClass(v, full) {
    if (v === null || v === undefined) return 's-none';
    var r = v / (full || 1);
    return r >= 0.8 ? 's-hi' : r >= 0.5 ? 's-mid' : 's-lo';
  }

  /* ===================== 彩带 & 闪光 ===================== */
  function fireConfetti() {
    var colors = ['#ff6b6b','#ffd166','#4f8cff','#34d399','#a78bfa','#f472b6','#22d3ee','#fb923c'];
    for (var i = 0; i < 42; i++) {
      (function (i) {
        var d = document.createElement('i');
        var ang = Math.random() * Math.PI * 2;
        var dist = 70 + Math.random() * 150;
        d.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
        d.style.setProperty('--dy', (Math.sin(ang) * dist * 0.85 + 30).toFixed(1) + 'px');
        d.style.setProperty('--rot', (Math.random() * 1000 - 500).toFixed(0) + 'deg');
        d.style.background = colors[i % colors.length];
        d.style.animationDelay = (Math.random() * 0.07).toFixed(2) + 's';
        confettiBox.appendChild(d);
        setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1500);
      })(i);
    }
  }

  function doFlash() {
    flash.classList.remove('go');
    void flash.offsetWidth;                 // 强制重排以重启动画
    flash.classList.add('go');
  }

  /* ===================== 扭蛋掉落（物理弹跳） ===================== */
  function dropCapsule(onSettled) {
    var colors = CAP_COLORS[Math.floor(Math.random() * CAP_COLORS.length)];
    if (colors === lastCapColor) {
      colors = CAP_COLORS[(CAP_COLORS.indexOf(colors) + 1) % CAP_COLORS.length];
    }
    lastCapColor = colors;
    capsule.style.setProperty('--c1', colors[0]);
    capsule.style.setProperty('--c2', colors[1]);

    // 瞬时复位上一轮的「爆开」状态，否则两半蛋壳会从半空中飞回来
    capsule.className = 'capsule show noanim';
    void capsule.offsetWidth;
    capsule.classList.remove('noanim');
    capsule.style.transform = 'translate(-50%,-52px)';

    var y = -52, v = 0;
    var G = 2400, FLOOR = 74, REST = 0.42;
    var last = 0, settled = false;

    function step(now) {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000);
      last = now;

      v += G * dt;
      y += v * dt;

      if (y >= FLOOR) {
        y = FLOOR;
        if (Math.abs(v) > 130 && !settled) {
          v = -v * REST;
          Sound.bounce(Math.min(1, Math.abs(v) / 1000));
        } else {
          capsule.style.transform = 'translate(-50%,' + FLOOR + 'px)';
          if (!settled) { settled = true; onSettled(); }
          return;
        }
      }
      capsule.style.transform = 'translate(-50%,' + y.toFixed(1) + 'px)';
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ===================== 整个开奖流程 ===================== */
  function start() {
    if (busy) return;

    var isGroup = (selectedCat === '中西名词解释');
    var items, gRec = null;

    if (isGroup) {
      items = drawGroup(3);
      if (items.length) gRec = makeGroupRecord(items);
    } else {
      var one = drawOne();
      items = one ? [one] : [];
    }

    if (!items.length) {
      hintEl.textContent = '这个范围的题都抽完啦 —— 点右下角魔盒重新开始';
      return;
    }

    busy = true;
    pendingItem = isGroup ? gRec : items[0];
    Sound.unlock();
    knob.disabled = true;
    cardEl.classList.remove('show');
    cardEl.innerHTML = '';
    hintEl.textContent = '咔啦咔啦…';

    // 1) 转旋钮
    knobAngle += 360;
    knob.style.transform = 'rotate(' + knobAngle + 'deg)';
    Sound.turn();
    dome.classList.add('jiggle');
    domeKick(760);
    setTimeout(function () { dome.classList.remove('jiggle'); }, 1050);

    // 2) 旋钮转完 → 落蛋
    setTimeout(function () {
      hintEl.textContent = '扭蛋掉出来了…';
      Sound.drop();
      dropCapsule(function () {
        // 3) 落定 → 摇晃蓄力
        hintEl.textContent = '要开啦…';
        capsule.classList.add('shake');
        Sound.rumble();

        // 4) 爆开
        setTimeout(function () {
          capsule.classList.remove('shake');
          capsule.classList.add('burst');
          Sound.pop();
          doFlash();
          fireConfetti();
          setTimeout(function () { Sound.fanfare(); }, 110);

          // 5) 揭晓题目
          setTimeout(function () {
            if (isGroup) {
              renderGroup(items, gRec);
              markGroup(gRec);
            } else {
              renderResult(items[0]);
              markDone(items[0]);
            }
            hintEl.textContent = '再转一次旋钮';
            knob.disabled = false;
            busy = false;
          }, 460);
        }, 820);
      });
    }, 700);
  }

  /* ===================== 事件 ===================== */
  knob.addEventListener('click', start);

  muteEl.addEventListener('click', function () {
    var m = !Sound.isMuted();
    Sound.setMuted(m);
    muteEl.textContent = m ? '🔇' : '🔊';
    muteEl.classList.toggle('off', m);
    if (!m) Sound.ding();          // 开音效时响一声，方便确认
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) Sound.unlock();
  });

  pboxEl.addEventListener('click', openSheet);
  sheetX.addEventListener('click', closeSheet);
  overlayEl.addEventListener('click', function (e) {
    if (e.target === overlayEl) closeSheet();      // 点遮罩关闭
  });
  /* ── 撤销：误删了能救回来 ── */
  var undoStack = [];
  function pushUndo(list, kind) {
    if (!list.length) return;
    undoStack.push({ kind: kind || 'del', items: list.slice() });
    if (undoStack.length > 30) undoStack.shift();
    paintUndo();
  }
  function paintUndo() {
    undoBtn.disabled = !undoStack.length;
  }
  function doUndo() {
    var u = undoStack.pop();
    if (!u) return;
    if (u.kind === 'exclude') {          // 撤销删除 → 同时解除永久排除
      u.items.forEach(function (d) { delete excluded[d.key]; });
      saveExcluded();
    }
    var have = {};
    done.forEach(function (d) { have[d.key] = 1; });
    u.items.forEach(function (d) { if (!have[d.key]) { done.push(d); have[d.key] = 1; } });
    done.sort(function (a, b) { return (a.t || 0) - (b.t || 0); });
    rebuildMap();
    saveDone();
    paintBox();
    paintSheet();
    paintMeta();
    paintUndo();
    hintEl.textContent = '已撤销，' + u.items.length + ' 道题回到魔盒';
  }
  function rebuildMap() {
    doneMap = {};
    done.forEach(function (d) {
      if (d.key) doneMap[d.key] = 1;
      if (d.group) d.group.forEach(function (k) { doneMap[k] = 1; });
    });
  }

  /* 组题（一次三个词）有自己的满分 */
  function fullOfRec(d) { return d.full || fullOf(d.cat); }
  function stepsOfRec(d) { return d.steps || stepsFor(d.cat); }

  /* 魔盒里直接打分 */
  doneList.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== doneList && !(el.classList &&
           (el.classList.contains('dsb') || el.classList.contains('dx2') ||
            el.classList.contains('dx3') || el.classList.contains('dx4')))) {
      el = el.parentNode;
    }
    if (!el || el === doneList) return;
    var i = parseInt(el.getAttribute('data-i'), 10);
    if (isNaN(i) || !done[i]) return;

    if (el.classList.contains('dx4')) {          // 永久删除，不再出现在题库
      var gone = done[i];
      if (!confirm('把这题从题库里删掉？以后不会再抽到。\n（底部「恢复」可以找回来）')) return;
      excluded[gone.key] = 1;
      saveExcluded();
      pushUndo([gone], 'exclude');
      done.splice(i, 1);
      rebuildMap();
      saveDone();
      paintBox(); paintSheet(); paintMeta();
      hintEl.textContent = '已删除，这题不会再出现';
      return;
    }

    if (el.classList.contains('dx3')) {
      askScore(done[i].key);
      return;
    }

    if (el.classList.contains('dx2')) {
      var back = done[i];
      pushUndo([back], 'del');
      done.splice(i, 1);
      rebuildMap();
      saveDone();
      paintBox(); paintSheet(); paintMeta();
      hintEl.textContent = '已把「' + (back.cat || '') + '」这题放回池子';
    } else {
      done[i].score = parseFloat(el.getAttribute('data-v'));
      saveDone();
      paintBox();
      paintSheet();
      paintMeta();
    }
  });

  undoBtn.addEventListener('click', doUndo);

  exBtn.addEventListener('click', function () {
    var n = Object.keys(excluded).length;
    if (!n) return;
    if (!confirm('把已删除的 ' + n + ' 道题恢复回题库？')) return;
    excluded = {};
    saveExcluded();
    paintSheet();
    paintMeta();
    hintEl.textContent = '已恢复 ' + n + ' 道题';
  });

  resetBtn.addEventListener('click', function () {
    if (!done.length) { closeSheet(); return; }
    if (!confirm('清空魔盒，把 ' + done.length + ' 道题放回池子？')) return;
    pushUndo(done, 'clear');
    done = [];
    doneMap = {};
    saveDone();
    paintBox();
    paintSheet();
    paintMeta();
    hintEl.textContent = '池子重新装满了，转动旋钮抽题（后悔了点「撤销」）';
  });

  // 首次任意触摸/点击就解锁音频（iOS 必须由用户手势触发）
  ['touchstart', 'pointerdown', 'click'].forEach(function (ev) {
    document.addEventListener(ev, function () { Sound.unlock(); },
                            { once: true, passive: true });
  });

  // 离线缓存：成功打开过一次之后，即使 GitHub 连不上也能用
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' ||
       location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  /* ===================== 页签切换 ===================== */
  var VIEW_TITLES = { pull: '扭蛋抽题', paper: '套题模拟', bank: '题库浏览' };

  function showView(v) {
    ['pull', 'paper', 'bank'].forEach(function (x) {
      document.getElementById('view-' + x).hidden = (x !== v);
    });
    [].forEach.call(document.querySelectorAll('.tab'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-view') === v);
    });
    domeActive = (v === 'pull');
    titleEl.textContent = VIEW_TITLES[v] || '扭蛋抽题';
    pboxEl.style.display = (v === 'pull') ? '' : 'none';
    if (v === 'bank') renderBank();
    if (v === 'paper' && !paperItems.length) makePaper();
  }

  [].forEach.call(document.querySelectorAll('.tab'), function (b) {
    b.addEventListener('click', function () { showView(b.getAttribute('data-view')); });
  });

  /* ===================== 套题 ===================== */
  var PAPER_SPEC = [
    { cat: '名解·文学',   n: 4, title: '一、名词解释 · 文学',   per: '2 分' },
    { cat: '名解·语言学', n: 3, title: '二、名词解释 · 语言学', per: '2 分' },
    { cat: '名解·翻译',   n: 3, title: '三、名词解释 · 翻译',   per: '2 分' },
    { cat: '问答·文学',   n: 2, title: '四、问答题 · 文学',     per: '15 分' },
    { cat: '问答·语言学', n: 2, title: '五、问答题 · 语言学',   per: '15 分' },
    { cat: '问答·翻译',   n: 1, title: '六、问答题 · 翻译',     per: '10 分' }
  ];
  var paperItems = [];
  var hintOpen = {};
  var bankOpen = {};

  function poolOf(cat) {
    var c = null;
    for (var i = 0; i < BANK.length; i++) if (BANK[i].name === cat) { c = BANK[i]; break; }
    if (!c) return [];
    return c.questions.map(function (q) {
      return { q: q, cat: cat, key: cat + '|' + qtext(q) };
    }).filter(function (x) { return !excluded[x.key]; });
  }

  function shufflePick(list, n, avoid) {
    var pool = list.filter(function (x) { return !avoid[x.key]; });
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    return pool.slice(0, n);
  }

  function makePaper() {
    var used = {};
    paperItems = [];
    PAPER_SPEC.forEach(function (sp) {
      shufflePick(poolOf(sp.cat), sp.n, used).forEach(function (x) {
        used[x.key] = 1;
        paperItems.push(x);
      });
    });
    hintOpen = {};
    renderPaper();
  }

  function renderPaper() {
    if (!paperItems.length) {
      paperEl.innerHTML = '<div class="pempty">还没生成套题<br>点上面的按钮来一套</div>';
      return;
    }
    var idx = 0, html = '';
    PAPER_SPEC.forEach(function (sp) {
      var got = paperItems.slice(idx, idx + sp.n);
      html += '<section class="psec"><h3><span>' + sp.title + '</span><em>' +
              got.length + ' 题 · 每题 ' + sp.per + '</em></h3>';
      got.forEach(function (it, k) {
        var q = it.q;
        var hint = (q && q.hint) ? q.hint : '';
        var src = (q && q.src) ? q.src : '';
        html += '<article class="pq">' +
                  '<div class="pqno">' + (k + 1) + '</div>' +
                  '<div class="pqbody">' +
                    '<div class="pqtext">' + esc(qtext(q)) + '</div>' +
                    (src ? '<div class="pqsrc">' + esc(src) + '</div>' : '') +
                    (hint && hintOpen[idx] ? '<div class="pqhint">' + esc(hint) + '</div>' : '') +
                  '</div>' +
                  '<div class="pqacts">' +
                    '<button class="pqre" data-i="' + idx + '">换一题</button>' +
                    (hint ? '<button class="pqhi" data-i="' + idx + '">' +
                            (hintOpen[idx] ? '收起' : '要点') + '</button>' : '') +
                  '</div>' +
                '</article>';
        idx++;
      });
      html += '</section>';
    });
    paperEl.innerHTML = html;
  }

  newPaperBtn.addEventListener('click', makePaper);

  paperEl.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== paperEl && !(el.classList &&
           (el.classList.contains('pqre') || el.classList.contains('pqhi')))) {
      el = el.parentNode;
    }
    if (!el || el === paperEl) return;
    var i = parseInt(el.getAttribute('data-i'), 10);
    if (isNaN(i) || !paperItems[i]) return;

    if (el.classList.contains('pqhi')) {
      hintOpen[i] = !hintOpen[i];
      renderPaper();
      return;
    }

    var used = {};
    paperItems.forEach(function (x, j) { if (j !== i) used[x.key] = 1; });
    used[paperItems[i].key] = 1;          // 别换回同一题
    var cand = shufflePick(poolOf(paperItems[i].cat), 1, used);
    if (!cand.length) { toast('这个分类已经没有可换的题了'); return; }
    paperItems[i] = cand[0];
    delete hintOpen[i];
    renderPaper();
  });

  /* ===================== 题库浏览 ===================== */
  function renderBank() {
    var pageY = window.pageYOffset || document.documentElement.scrollTop || 0;
    var innerTop = {};
    [].forEach.call(bankList.querySelectorAll('.blist'), function (el) {
      var head = el.parentNode.querySelector('.bhead');
      if (head) innerTop[head.getAttribute('data-cat')] = el.scrollTop;
    });

    var live = 0, total = 0, html = '';
    BANK.forEach(function (c) {
      var arr = c.questions, alive = 0;
      total += arr.length;
      arr.forEach(function (q) { if (!excluded[c.name + '|' + qtext(q)]) alive++; });
      live += alive;
      var open = !!bankOpen[c.name];
      html += '<section class="bsec">' +
                '<button class="bhead" data-cat="' + esc(c.name) + '">' +
                  '<span>' + (open ? '▾ ' : '▸ ') + esc(c.name) + '</span>' +
                  '<em>' + alive + ' / ' + arr.length + '</em>' +
                '</button>' +
                (open ? (bankMode === 'grid'
                  ? '<div class="blist grid">' + arr.map(function (q) {
                      var k = c.name + '|' + qtext(q);
                      var off = !!excluded[k];
                      var t = qtext(q).replace(/\s+/g, '');
                      return '<button class="bslot' + (off ? ' off' : '') +
                             '" data-k="' + esc(k) + '">' +
                               '<span class="bsi"></span>' +
                               '<span class="bsl">' + esc(t.slice(0, 2)) + '</span>' +
                             '</button>';
                    }).join('') + '</div>'
                  : '<div class="blist">' + arr.map(function (q) {
                      var k = c.name + '|' + qtext(q);
                      var off = !!excluded[k];
                      var t = qtext(q);
                      if (t.length > 64) t = t.slice(0, 62) + '…';
                      return '<div class="brow' + (off ? ' off' : '') + '">' +
                               '<span class="bt">' + esc(t) + '</span>' +
                               '<button class="bdel' + (off ? ' on' : '') + '" data-k="' + esc(k) + '">' +
                                 (off ? '恢复' : '删除') + '</button>' +
                             '</div>';
                    }).join('') + '</div>') : '') +
              '</section>';
    });
    bankList.innerHTML = html;

    // 还原滚动位置（展开/收起时也不跳回顶部）
    [].forEach.call(bankList.querySelectorAll('.blist'), function (el) {
      var head = el.parentNode.querySelector('.bhead');
      if (head) {
        var k = head.getAttribute('data-cat');
        if (innerTop[k]) el.scrollTop = innerTop[k];
      }
    });
    if (pageY) window.scrollTo(0, pageY);

    bankCount.textContent = '可用 ' + live + ' / 共 ' + total + ' 题';
    restoreAllBtn.style.display = Object.keys(excluded).length ? '' : 'none';
  }

  /* 只更新计数，不动列表 DOM（删题时不重绘，滚动才不会跳） */
  function updateBankCounts() {
    var live = 0, total = 0;
    [].forEach.call(bankList.querySelectorAll('.bhead'), function (head) {
      var cat = head.getAttribute('data-cat'), c = null;
      for (var i = 0; i < BANK.length; i++) if (BANK[i].name === cat) { c = BANK[i]; break; }
      if (!c) return;
      var alive = 0;
      c.questions.forEach(function (q) {
        if (!excluded[cat + '|' + qtext(q)]) alive++;
      });
      live += alive;
      total += c.questions.length;
      var em = head.querySelector('em');
      if (em) em.textContent = alive + ' / ' + c.questions.length;
    });
    bankCount.textContent = '可用 ' + live + ' / 共 ' + total + ' 题';
    restoreAllBtn.style.display = Object.keys(excluded).length ? '' : 'none';
  }

  bankList.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== bankList && !(el.classList &&
           (el.classList.contains('bhead') || el.classList.contains('bdel') ||
            el.classList.contains('bslot')))) {
      el = el.parentNode;
    }
    if (!el || el === bankList) return;

    if (el.classList.contains('bhead')) {
      var cat = el.getAttribute('data-cat');
      bankOpen[cat] = !bankOpen[cat];
      renderBank();
      return;
    }
    if (el.classList.contains('bslot')) {
      openDetail(el.getAttribute('data-k'));
      return;
    }

    var k = el.getAttribute('data-k');
    if (excluded[k]) delete excluded[k]; else excluded[k] = 1;
    saveExcluded();
    paintBox();
    paintMeta();

    // 只动这一行，不重绘整个列表
    var off = !!excluded[k];
    var row = el.parentNode;
    if (row && row.classList) row.classList.toggle('off', off);
    el.classList.toggle('on', off);
    el.textContent = off ? '恢复' : '删除';
    updateBankCounts();
  });

  /* ── 题目详情浮层 ── */
  function openDetail(k) {
    bdKey = k;
    var parts = k.split('|');
    var off = !!excluded[k];
    bdHead.textContent = parts[0] || '题目';
    bdQ.textContent = parts.slice(1).join('|');
    bdS.textContent = off ? '状态：已删除（不会出现在抽题池）' : '状态：可用';
    bdBtn.textContent = off ? '恢复这题' : '删除这题';
    bdBtn.classList.toggle('on', off);
    bdEl.classList.add('on');
  }
  function closeDetail() { bdEl.classList.remove('on'); bdKey = null; }

  bdX.addEventListener('click', closeDetail);
  bdEl.addEventListener('click', function (e) { if (e.target === bdEl) closeDetail(); });

  bdBtn.addEventListener('click', function () {
    if (!bdKey) return;
    if (excluded[bdKey]) delete excluded[bdKey]; else excluded[bdKey] = 1;
    saveExcluded();
    paintBox();
    paintMeta();
    renderBank();
    var off = !!excluded[bdKey];
    bdS.textContent = off ? '状态：已删除（不会出现在抽题池）' : '状态：可用';
    bdBtn.textContent = off ? '恢复这题' : '删除这题';
    bdBtn.classList.toggle('on', off);
  });

  bankModeBtn.addEventListener('click', function () {
    bankMode = bankMode === 'grid' ? 'list' : 'grid';
    bankModeBtn.textContent = bankMode === 'grid' ? '列表' : '格子';
    renderBank();
  });

  restoreAllBtn.addEventListener('click', function () {
    var n = Object.keys(excluded).length;
    if (!n) return;
    if (!confirm('恢复全部 ' + n + ' 道已删除的题？')) return;
    excluded = {};
    saveExcluded();
    paintBox();
    paintMeta();
    renderBank();
  });

  /* 轻提示 */
  var toastEl = null;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('on'); }, 1700);
  }

  loadExcluded();
  buildChips();
  loadDone();
  paintBox();
  paintMeta();
  showView('pull');
})();
</script>
</body>
</html>
